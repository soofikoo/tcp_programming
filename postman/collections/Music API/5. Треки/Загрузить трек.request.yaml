  type: json
  content: |-
    {
      "title": "Demo track",
      "album_id": {{album_id}},
      "duration": 215,
      "file_path": "/media/demo.mp3"
    }
auth:
  type: bearer
  credentials:
    token: "{{artist_token}}"
order: 1000
