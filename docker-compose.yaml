services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - music-network

  migrate:
    build: .
    command: ["sh", "scripts/init_db.sh"]
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    networks:
      - music-network

  rabbitmq:
    image: rabbitmq:3-management
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports:
      - "15672:15672"
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "-q", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - music-network


  recommendation:
    build: .
    command: [ "python", "-m", "recommendation_service.server" ]
    env_file: .env
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks:
      - music-network

  api:
    build: .
    command: [ "uvicorn", "api.main:app", "--host", "0.0.0.0", "--port", "8000" ]
    env_file: .env
    ports:
      - "8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
      recommendation:
        condition: service_started
    networks:
      - music-network

  notification:
    build: .
    command: [ "uvicorn", "notification_service.main:app", "--host", "0.0.0.0", "--port", "8002" ]
    env_file: .env
    ports:
      - "8002:8002"
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - music-network

networks:
  music-network:

volumes:
  pgdata: